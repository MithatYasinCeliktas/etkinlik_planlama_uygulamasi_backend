spring.application.name=etkinlik_planlama_uygulamasi_backend

# Server Port Change
server.port=8085

# Session cookie — localhost:4200 <-> :8085 oturum paylaşımı
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./etkinlik_planlama_uygulamasi_backend_db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# actuator configuration
management.endpoints.web.exposure.include=*
